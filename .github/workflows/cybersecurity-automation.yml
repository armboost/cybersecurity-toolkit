on: {}

name: Cybersecurity Automation Workflow

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'  # Runs daily at 3 AM UTC

jobs:
  security-automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install yara jq -y
          pip install requests splunk-sdk yara-python

      - name: Run YARA Scan
        run: python scripts/python/yara_scan.py
      
      - name: Fetch OSINT Data
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          IP_ADDRESS: ${{ secrets.IP_ADDRESS }} 
        run: python scripts/python/osint_lookup.py 

    

